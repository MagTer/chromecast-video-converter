services:
  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    image: chromecast-video-converter/orchestrator:dev
    ports:
      - "9000:9000"
    volumes:
      - ./services/orchestrator/app:/app/app:ro
      - ./config:/app/config
      - ./data:/app/data
      - ${PATH_MOVIES}:/watch/movies:ro
      - ${PATH_SERIES}:/watch/series:ro
      - ${PATH_MOVIES}:/media/movies:ro
      - ${PATH_SERIES}:/media/series:ro
    depends_on:
      - redis
    environment:
      - PORT=9000
      - JOB_QUEUE=redis://redis:6379/0
      - DATA_DIR=/app/data
      - CONFIG_DB_PATH=/app/data/config.db

  folder-watcher:
    build:
      context: ./services/folder-watcher
      dockerfile: Dockerfile
    image: chromecast-video-converter/folder-watcher:dev
    depends_on:
      - orchestrator
    volumes:
      - ${PATH_MOVIES}:/watch/movies:ro
      - ${PATH_SERIES}:/watch/series:ro
    environment:
      - WATCH_ROOTS=movies:/watch/movies,series:/watch/series
      - ORCHESTRATOR_URL=http://orchestrator:9000
      - EVENT_BUFFER_SECONDS=2
      - EVENT_RETRY_ATTEMPTS=5
      - EVENT_RETRY_BACKOFF_SECONDS=2
      - ROOT_RETRY_SECONDS=5

  gpu-ffmpeg:
    build:
      context: ./services/gpu-ffmpeg
      dockerfile: Dockerfile
    image: chromecast-video-converter/gpu-ffmpeg:dev
    gpus: all
    volumes:
      - ${PATH_MOVIES}:/media/movies
      - ${PATH_SERIES}:/media/series
      - ${PATH_MOVIES}:/watch/movies
      - ${PATH_SERIES}:/watch/series
    environment:
      - LOG_LEVEL=INFO
      - FFMPEG_LOG_LEVEL=info
      - ORCHESTRATOR_URL=http://orchestrator:9000
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - GPU_STREAM_READER_LIMIT=${GPU_STREAM_READER_LIMIT:-1000000}

  redis:
    image: redis:8
    volumes:
      - redis_data:/data

volumes:
  redis_data:
