name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r services/orchestrator/requirements.txt
          python -m pip install -r services/gpu-ffmpeg/requirements.txt

      - name: Run ruff
        run: ruff check .

      - name: Run black
        run: black --check .

      - name: Run Orchestrator tests
        env:
          PYTHONPATH: "${{ github.workspace }}/services/orchestrator"
        run: pytest services/orchestrator/tests/

      - name: Run GPU Worker tests
        env:
          PYTHONPATH: "${{ github.workspace }}/services/gpu-ffmpeg"
        run: pytest services/gpu-ffmpeg/tests/ services/gpu-ffmpeg/test_worker.py
