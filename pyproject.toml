[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chromecast-converter-monorepo"
version = "0.1.0"
description = "Monorepo for Chromecast Video Converter services"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pyyaml",
    "jinja2",
    "httpx",
    "sqlalchemy",
    "redis[hiredis]",
    "tenacity",
    "watchdog"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.21",
    "black==26.5.1",
    "mypy==2.3.0",
    "types-requests==2.33.0.20260712",
    "fakeredis==2.36.2",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1"
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "services/orchestrator/tests",
    "services/gpu-ffmpeg/tests",
    "services/folder-watcher/tests"
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C"]

[tool.black]
line-length = 100

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]
exclude = ["data*", "media*", "config*", "docs*", "scripts*", "tests*"]

[tool.mypy]
files = "."
explicit_package_bases = true
namespace_packages = true
# SQLAlchemy 2.0 Mapped[] models type-check natively; the legacy
# sqlalchemy.ext.mypy.plugin is unmaintained and breaks under mypy 2.x.
plugins = ["pydantic.mypy"]

# redis-py >= 6 ships its own annotations where every reply is typed
# `bytes | str` (it cannot narrow on decode_responses=True). The job manager
# always uses decode_responses=True, so the bytes branches are unreachable at
# runtime; silence the resulting false positives in that module only.
[[tool.mypy.overrides]]
module = "app.jobs"
disable_error_code = [
    "arg-type",
    "union-attr",
    "index",
    "misc",
    "str-bytes-safe",
    "str-unpack",
    "return-value",
]
# We need to ignore the duplicate 'app' module issue for now or exclude one
# But ideally, explicit_package_bases helps if we define MYPYPATH correctly.
# Given the user just asked for the pyproject structure, I will add some basic config.
